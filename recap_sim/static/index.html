<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Confluence Recap Pipeline - SIMULATION</title>
<style>
  body { font-family: -apple-system, sans-serif; margin: 0; background: #0e1116; color: #d7dde4; }
  header { padding: 10px 16px; background: #161b22; border-bottom: 1px solid #2d333b; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  header b { color: #f0c674; }
  .warn { color: #e06c75; font-size: 12px; }
  #main { display: flex; }
  #svgwrap { flex: 1; padding: 8px; }
  #side { width: 340px; background: #161b22; border-left: 1px solid #2d333b; padding: 10px; font-size: 12px; overflow-y: auto; max-height: 92vh; }
  svg text { fill: #d7dde4; font-size: 11px; }
  .box { fill: #1c2128; stroke: #444c56; }
  .box:hover { stroke: #f0c674; cursor: pointer; }
  .sel { stroke: #f0c674; stroke-width: 2; }
  .q { fill: #3a2f0d; stroke: #b08b00; }
  .dlq { fill: #3b1518; stroke: #c03540; }
  .lam { fill: #2d2a36; stroke: #8a7ba8; }
  .store { fill: #12283a; stroke: #2f81f7; }
  .edge { stroke: #4d5661; fill: none; marker-end: url(#arrow); }
  .edge.hot { stroke: #f0c674; animation: pulse 1s infinite; }
  .edge.bad { stroke: #e06c75; marker-end: url(#arrowred); }
  @keyframes pulse { 50% { stroke-opacity: 0.35; } }
  .counter { fill: #f0c674; font-size: 10px; }
  .badcounter { fill: #e06c75; font-size: 10px; }
  #log { height: 220px; overflow-y: auto; background: #0e1116; border: 1px solid #2d333b; padding: 6px; font-family: monospace; font-size: 10px; }
  .ev-bad { color: #e06c75; }
  button, select, input { background: #21262d; color: #d7dde4; border: 1px solid #444c56; border-radius: 4px; padding: 4px 8px; }
  h3 { margin: 8px 0 4px 0; font-size: 13px; color: #f0c674; }
  table { width: 100%; border-collapse: collapse; }
  td { padding: 1px 4px; border-bottom: 1px solid #21262d; }
</style>
</head>
<body>
<header>
  <b>Confluence Recap pipeline</b>
  <span class="warn">SIMULATION - synthetic data, deterministic seed, not real AWS. The failure scenario is a plausible reconstruction, not a real incident.</span>
  <span style="flex:1"></span>
  <select id="scenario">
    <option value="baseline">baseline (no faults)</option>
    <option value="bug">bug: gatekeeper TTL expiry mid-redrive</option>
  </select>
  <input id="seed" value="42" size="5" title="seed">
  <button onclick="resetSim()">restart</button>
  <button id="pp" onclick="togglePause()">pause</button>
  <label>speed <input id="speed" type="range" min="2" max="240" value="30" oninput="setSpeed(this.value)" style="width:90px"> <span id="spd">30</span>x</label>
  <span id="clock"></span>
</header>
<div id="main">
  <div id="svgwrap">
  <svg viewBox="0 0 980 560" width="100%">
    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#4d5661"/></marker>
      <marker id="arrowred" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#e06c75"/></marker>
    </defs>
    <!-- left stores -->
    <g id="n-scratch" class="node"><rect class="box store" x="10" y="30" width="120" height="46" rx="4"/><text x="20" y="48">scratch.recap_reports</text><text class="counter" x="20" y="66" id="c-scratch"></text></g>
    <g id="n-eventtrack" class="node"><rect class="box store" x="10" y="470" width="120" height="46" rx="4"/><text x="20" y="488">cloud.event_track</text><text class="counter" x="20" y="506" id="c-eventtrack"></text></g>
    <g id="n-spark" class="node"><rect class="box" x="150" y="110" width="110" height="46" rx="4"/><text x="160" y="128">DB spark jobs</text><text class="counter" x="160" y="146" id="c-spark"></text></g>
    <g id="n-socrates" class="node"><rect class="box" x="150" y="30" width="110" height="46" rx="4"/><text x="160" y="48">Socrates GW</text><text class="counter" x="160" y="66" id="c-socrates"></text></g>
    <g id="n-executor" class="node"><rect class="box lam" x="150" y="190" width="110" height="46" rx="4"/><text x="160" y="208">Statement Executor</text><text class="counter" x="160" y="226" id="c-executor"></text></g>
    <g id="n-chunks" class="node"><rect class="box q" x="150" y="260" width="110" height="40" rx="4"/><text x="160" y="278">Statement Chunk events</text><text class="counter" x="160" y="293" id="c-chunks"></text></g>
    <g id="n-download" class="node"><rect class="box lam" x="150" y="330" width="110" height="70" rx="4"/><text x="160" y="348">Download Chunks</text><text class="counter" x="160" y="366" id="c-download"></text><text class="counter" x="160" y="384" id="c-download2"></text></g>
    <!-- sqs box -->
    <rect class="box" x="300" y="240" width="170" height="230" fill="none" stroke-dasharray="4 3"/>
    <text x="310" y="258">AWS reports SQS queues</text>
    <g id="n-q1" class="node"><rect class="box q" x="310" y="270" width="70" height="56" rx="4"/><text x="318" y="286">SQS Q1</text><text class="counter" x="318" y="300" id="c-q1"></text><text class="counter" x="318" y="314" id="c-q1b"></text></g>
    <g id="n-q2" class="node"><rect class="box q" x="390" y="270" width="70" height="56" rx="4"/><text x="398" y="286">SQS Q2</text><text class="counter" x="398" y="300" id="c-q2"></text><text class="counter" x="398" y="314" id="c-q2b"></text></g>
    <g id="n-dlq1" class="node"><rect class="box dlq" x="310" y="340" width="70" height="40" rx="4"/><text x="318" y="356">DLQ 1</text><text class="badcounter" x="318" y="372" id="c-dlq1"></text></g>
    <g id="n-dlq2" class="node"><rect class="box dlq" x="390" y="340" width="70" height="40" rx="4"/><text x="398" y="356">DLQ 2</text><text class="badcounter" x="398" y="372" id="c-dlq2"></text></g>
    <g id="n-rep1" class="node"><rect class="box lam" x="310" y="400" width="70" height="40" rx="4"/><text x="316" y="416">Replayer 1</text><text class="counter" x="316" y="432" id="c-rep1"></text></g>
    <g id="n-rep2" class="node"><rect class="box lam" x="390" y="400" width="70" height="40" rx="4"/><text x="396" y="416">Replayer 2</text><text class="counter" x="396" y="432" id="c-rep2"></text></g>
    <!-- processor groups -->
    <g id="n-g1" class="node"><rect class="box" x="510" y="330" width="150" height="90" rx="4"/><text x="520" y="348">RecapReportsProcessor</text><text x="520" y="362">Group 1</text><text class="counter" x="520" y="380" id="c-g1"></text><text class="counter" x="520" y="396" id="c-g1b"></text></g>
    <g id="n-g2" class="node"><rect class="box" x="510" y="90" width="150" height="90" rx="4"/><text x="520" y="108">RecapReportsProcessor</text><text x="520" y="122">Group 2</text><text class="counter" x="520" y="140" id="c-g2"></text><text class="counter" x="520" y="156" id="c-g2b"></text></g>
    <!-- postgres -->
    <g id="n-pg" class="node"><rect class="box store" x="700" y="210" width="110" height="70" rx="4"/><text x="710" y="230">Postgres</text><text class="counter" x="710" y="248" id="c-pg"></text><text class="badcounter" x="710" y="266" id="c-pg2"></text></g>
    <!-- monolith -->
    <g id="n-mono1" class="node"><rect class="box" x="700" y="330" width="180" height="60" rx="4"/><text x="710" y="348">Idempotency check (Postgres)</text><text class="counter" x="710" y="364" id="c-gk"></text><text class="counter" x="710" y="380" id="c-gk2"></text></g>
    <g id="n-mono2" class="node"><rect class="box" x="700" y="90" width="180" height="60" rx="4"/><text x="710" y="108">Monolith / CC-notifications</text><text class="counter" x="710" y="126" id="c-cc"></text><text class="counter" x="710" y="142" id="c-cc2"></text></g>
    <!-- analytics -->
    <g id="n-anaq" class="node"><rect class="box q" x="700" y="440" width="130" height="40" rx="4"/><text x="708" y="456">Analytic Events SQS</text><text class="counter" x="708" y="472" id="c-anaq"></text></g>
    <g id="n-anal" class="node"><rect class="box lam" x="860" y="440" width="100" height="40" rx="4"/><text x="868" y="456">Analytics Lambda</text><text class="counter" x="868" y="472" id="c-anal"></text></g>
    <g id="n-shq" class="node"><rect class="box q" x="700" y="500" width="130" height="40" rx="4"/><text x="708" y="516">Streamhub Failure SQS</text><text class="counter" x="708" y="532" id="c-shq"></text></g>
    <!-- edges -->
    <line class="edge" x1="205" y1="156" x2="205" y2="190" id="e-spark-exec"/>
    <line class="edge" x1="260" y1="213" x2="150" y2="60" id="e-exec-soc"/>
    <line class="edge" x1="260" y1="213" x2="260" y2="260" id="e-exec-chunks"/>
    <line class="edge" x1="205" y1="300" x2="205" y2="330" id="e-chunks-dl"/>
    <line class="edge" x1="260" y1="356" x2="260" y2="60" id="e-dl-soc"/>
    <line class="edge" x1="260" y1="380" x2="310" y2="330" id="e-dl-q1"/>
    <line class="edge" x1="260" y1="380" x2="390" y2="330" id="e-dl-q2"/>
    <line class="edge" x1="380" y1="326" x2="540" y2="330" id="e-q1-g1"/>
    <line class="edge" x1="440" y1="326" x2="560" y2="180" id="e-q2-g2"/>
    <line class="edge" x1="660" y1="370" x2="700" y2="250" id="e-g1-pg"/>
    <line class="edge" x1="660" y1="140" x2="700" y2="230" id="e-g2-pg"/>
    <line class="edge" x1="660" y1="380" x2="700" y2="360" id="e-g1-mono"/>
    <line class="edge" x1="660" y1="130" x2="700" y2="115" id="e-g2-cc"/>
    <line class="edge" x1="660" y1="400" x2="700" y2="455" id="e-g1-anaq"/>
    <line class="edge" x1="830" y1="460" x2="860" y2="460" id="e-anaq-anal"/>
    <line class="edge" x1="910" y1="440" x2="130" y2="493" id="e-anal-et"/>
    <line class="edge bad" x1="345" y1="340" x2="345" y2="326" id="e-dlq1-q1"/>
    <line class="edge bad" x1="425" y1="340" x2="425" y2="326" id="e-dlq2-q2"/>
    <line class="edge bad" x1="345" y1="400" x2="345" y2="380" id="e-rep1-dlq1"/>
    <line class="edge bad" x1="425" y1="400" x2="425" y2="380" id="e-rep2-dlq2"/>
  </svg>
  </div>
  <div id="side">
    <h3 id="selname">click a node</h3>
    <div id="seldetail">-</div>
    <h3>event log</h3>
    <div id="log"></div>
  </div>
</div>
<script src="static/app.js"></script>
</body>
</html>
